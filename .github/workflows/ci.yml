name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Install isolated PDF QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nexation-pdf-qa" playwright
          "$RUNNER_TEMP/nexation-pdf-qa/node_modules/.bin/playwright" install --with-deps chromium
          python -m pip install --target "$RUNNER_TEMP/nexation-pdf-render" pymupdf
      - name: Verify article PDF and responsive layout
        env:
          VITE_SUPABASE_URL: https://pdf-qa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: pdf-layout-test-only
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/nexation-pdf-dev.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -sf http://127.0.0.1:4173/blog && break || sleep 1; done
          mkdir -p "$RUNNER_TEMP/nexation-pdf-artifacts"
          node <<'NODE'
          const { chromium } = require(process.env.RUNNER_TEMP + '/nexation-pdf-qa/node_modules/playwright');
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/nexation-pdf-artifacts';
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror', error => errors.push(error.message));
            const md=fs.readFileSync('content/articles/ai-agent-evaluation-enterprise-kpis.md','utf8');
            const meta=(key)=>md.match(new RegExp('^'+key+': "([^"\\n]+)"','m'))?.[1] ?? key;
            const fixture={id:'00000000-0000-4000-8000-000000000001',title:meta('title'),excerpt:meta('excerpt'),slug:meta('slug'),content:md.replace(/^---[\s\S]*?---\s*/,''),status:'published',published_at:'2026-08-31T09:30:00Z',updated_at:'2026-08-31T09:30:00Z'};
            await page.route('https://pdf-qa.supabase.co/rest/v1/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(route.request().url().includes('/articles?')?fixture:[])}));
            await page.goto('http://127.0.0.1:4173/blog/ai-agent-evaluation-enterprise-kpis', {waitUntil:'networkidle'});
            await page.locator('.article-print-root').waitFor();
            await page.evaluate(() => document.fonts.ready);
            await page.locator('article > img').evaluate(image => image.decode());
            if(await page.locator('button[data-pdf-action]').count() !== 2) throw new Error('Expected PDF buttons at top and bottom');
            await page.screenshot({path:path+'/desktop.png',fullPage:true});
            await page.locator('button[data-pdf-action]').first().click();
            await page.emulateMedia({media:'print'});
            if(await page.locator('button[data-pdf-action]').first().isVisible()) throw new Error('PDF actions leaked into print');
            await page.pdf({path:path+'/nexation-article.pdf',format:'A4',preferCSSPageSize:true,printBackground:true,displayHeaderFooter:false});
            await page.emulateMedia({media:'screen'});
            await page.setViewportSize({width:390,height:844});
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.screenshot({path:path+'/mobile-top.png'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth);
            if(overflow) throw new Error('Mobile horizontal overflow');
            await page.locator('button[data-pdf-action]').last().scrollIntoViewIfNeeded();
            await page.screenshot({path:path+'/mobile-bottom.png'});
            fs.writeFileSync(path+'/result.json',JSON.stringify({buttons:2,mobileOverflow:overflow,runtimeErrors:errors},null,2));
            if(errors.length) throw new Error(errors.join('; '));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          PYTHONPATH="$RUNNER_TEMP/nexation-pdf-render" python <<'PY'
          import os, fitz
          folder = os.environ['RUNNER_TEMP'] + '/nexation-pdf-artifacts'
          doc = fitz.open(folder + '/nexation-article.pdf')
          print('PDF pages:',len(doc))
          assert len(doc) > 0
          for i,page in enumerate(doc):
              page.get_pixmap(matrix=fitz.Matrix(1.2,1.2)).save(folder + '/pdf-page-' + str(i+1) + '.png')
          PY
      - name: Upload PDF QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-pdf-visual-qa
          path: ${{ runner.temp }}/nexation-pdf-artifacts
