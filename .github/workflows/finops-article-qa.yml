name: FinOps article visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - content/articles/ai-agent-finops-cost-per-outcome.md
      - public/blog/ai-agent-finops-cost-per-outcome.webp
      - src/lib/article-seo.ts
      - src/lib/article-covers.ts
      - scripts/qa-finops-article.mjs
      - .github/workflows/finops-article-qa.yml

permissions:
  contents: read

jobs:
  article-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_content_test
      PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/article-qa/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/article-qa" --no-save --ignore-scripts playwright@1.62.1
      - run: node "$PLAYWRIGHT_PACKAGE/cli.js" install --with-deps chromium
      - name: Run isolated article fixture checks
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/finops-dev.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/blog > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-finops-article.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finops-article-visual-qa
          path: article-qa-output
          if-no-files-found: warn
